<!DOCTYPE html>
<html lang="es">
  <head>
    <!-- Configuración del conjunto de caracteres UTF-8 para soportar caracteres especiales españoles -->
    <meta charset="UTF-8" />

    <!-- Ícono que aparece en la pestaña del navegador (favicon) -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- 
      Configuración responsive: 
      - width=device-width: El ancho de la página se ajusta al ancho del dispositivo
      - initial-scale=1.0: Zoom inicial al 100%
      Esto hace que la aplicación se vea bien en móviles, tablets y escritorio
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 
      Meta descripción para SEO (motores de búsqueda como Google)
      Este texto aparece en los resultados de búsqueda
    -->
    <meta
      name="description"
      content="__APP_DESCRIPTION__"
    />

    <!-- Título que aparece en la pestaña del navegador -->
    <meta name="theme-color" content="#f4f6fb" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Aplica el tema guardado antes de pintar para evitar parpadeo
      (function () {
        try {
          var t = localStorage.getItem("cs-theme") === "dark" ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>

    <title>__APP_NAME__</title>
  </head>
  <body>
    <script src="/security.js"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
